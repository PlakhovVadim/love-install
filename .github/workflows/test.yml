name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install love CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x install.sh bin/love
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/bin/love" "$HOME/.local/bin/love"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install love CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $PWD 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Verify love help
        shell: bash
        run: love help

      - name: Verify love version
        shell: bash
        run: love version

      - name: Verify love list
        shell: bash
        run: love list

      - name: Verify love doctor
        shell: bash
        run: love doctor

      - name: Verify love info for module
        shell: bash
        run: love info -m button

      - name: Verify love info for preset
        shell: bash
        run: love info -p admin

      - name: Test custom preset creation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/custom-project"
          cd "$RUNNER_TEMP/custom-project"
          love install custom
          test -f love.json
          love status

      - name: Test add module from GitHub
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/add-project"
          cd "$RUNNER_TEMP/add-project"
          love install custom
          love add button
          test -f css/love.button.css
          test -f css/love.tokens.css
          test -f css/love.base.css
          test -f css/love.reset.css
          love status

      - name: Test remove module
        shell: bash
        run: |
          cd "$RUNNER_TEMP/add-project"
          love remove button
          test ! -f css/love.button.css
          test -f css/love.base.css

      - name: Test preset installation from GitHub
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/preset-project"
          cd "$RUNNER_TEMP/preset-project"
          love install auth

          expected="love.reset.css love.tokens.css love.base.css love.layout.css love.utilities.css love.animations.css love.themes.css love.button.css love.card.css love.form.css love.alert.css love.spinner.css"

          for f in $expected; do
            if [ ! -f "css/$f" ]; then
              echo "MISSING: css/$f"
              exit 1
            fi
          done

          echo "All expected files present"

      - name: Test love check on sample HTML
        shell: bash
        run: |
          cd "$RUNNER_TEMP/preset-project"
          printf '<!doctype html>\n<html><body><h1>Test</h1><button class="btn btn-primary">Click</button></body></html>\n' > index.html
          love check
